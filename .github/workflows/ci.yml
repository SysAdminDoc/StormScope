name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STORMSCOPE_TEST_ARTIFACTS: test-results/browser
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache pinned Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.61.1-${{ hashFiles('package-lock.json') }}

      - name: Install exact toolchain
        run: |
          python -m pip install --requirement requirements-dev.txt
          npm install --global npm@11.13.0
          npm ci
          npx playwright install-deps chromium firefox webkit
          if [ '${{ steps.playwright-cache.outputs.cache-hit }}' != 'true' ]; then
            npx playwright install chromium firefox webkit
          fi

      - name: Run complete regression gate
        run: python scripts/check.py

      - name: Retain browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser
          if-no-files-found: warn
          retention-days: 7
